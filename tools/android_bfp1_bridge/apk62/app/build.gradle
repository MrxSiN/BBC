plugins { id 'com.android.application' }

android {
    namespace 'org.brainfuckcc.callableacceptance'
    compileSdk 35

    defaultConfig {
        applicationId 'org.brainfuckcc.callableacceptance'
        minSdk 28
        targetSdk 28
        versionCode 1
        versionName '62-gate'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        debug { debuggable true }
    }
    sourceSets {
        main {
            java.srcDirs += ['../../org']
            jniLibs.srcDirs += ['src/main/jniLibs']
        }
    }
    externalNativeBuild {
        cmake { path file('../../CMakeLists.txt') }
    }
    packaging {
        jniLibs { useLegacyPackaging = true }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
